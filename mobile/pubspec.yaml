name: mobile
description: "DentID - Forensic Odontology Identification System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^12.1.3

  # Networking
  dio: ^5.4.0
  web_socket_channel: ^2.4.0

  # Storage & Database
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^5.0.2


  # UI Components & Utilities
  google_fonts: ^6.1.0
  photo_view: ^0.14.0
  camera: ^0.10.5+5
  pdf: ^3.10.7
  printing: ^5.11.1
  fl_chart: ^0.66.0
  local_auth: ^2.1.8
  intl: ^0.18.1
  path_provider: ^2.1.2
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.0

  # Models & Serialization
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
