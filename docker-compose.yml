version: '3.9'
services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://opg:opg@db:5432/opgdb
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      SECRET_KEY: dev-secret-change-in-production
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
      - ./ml_models:/models
    depends_on: [db, redis, minio]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    command: celery -A app.worker.celery worker --loglevel=info -Q preprocessing,matching
    environment:
      DATABASE_URL: postgresql+asyncpg://opg:opg@db:5432/opgdb
      REDIS_URL: redis://redis:6379
    volumes:
      - ./ml_models:/models
    depends_on: [db, redis]

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: opg
      POSTGRES_PASSWORD: opg
      POSTGRES_DB: opgdb
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
